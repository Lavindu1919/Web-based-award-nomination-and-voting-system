
spring.application.name=Award Vote Lanka

# Microsoft SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=awardvote_lanka;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=1234
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf
spring.thymeleaf.cache=false

# Server
server.port=8080

#  File uploads (evidence documents, sponsor logos, banners)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

