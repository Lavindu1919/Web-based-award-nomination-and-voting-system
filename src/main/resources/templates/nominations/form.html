<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head th:replace="~{fragments/head :: head('Submit Nomination')}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container py-5" style="max-width:640px;">
    <div class="page-eyebrow">Module 3 — Nominee Management</div>
    <h2 class="mb-4" th:if="${nomination.id == null}"><i class="bi bi-clipboard-plus me-2"></i>Submit a Nomination</h2>
    <h2 class="mb-4" th:if="${nomination.id != null}"><i class="bi bi-pencil-square me-2"></i>Edit Nominee</h2>
    <div class="av-card p-4">
        <form th:action="${nomination.id == null} ? @{/nominations/save} : @{'/nominations/' + ${nomination.id} + '/update'}"
              th:object="${nomination}" method="post">
            <div class="mb-3">
                <label class="form-label">Category</label>
                <select name="categoryId" class="form-select" required>
                    <option th:each="c : ${categories}" th:value="${c.id}"
                            th:selected="${nomination.category != null and nomination.category.id == c.id}"
                            th:text="${c.name + ' (' + c.awardProgramme.name + ')'}"></option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Nominee Name</label>
                <input type="text" th:field="*{nomineeName}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Nominee Email</label>
                <input type="email" th:field="*{nomineeEmail}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Why does this nominee deserve the award?</label>
                <textarea th:field="*{description}" class="form-control" rows="4" required></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Evidence Report Link <span class="text-muted fw-normal">(optional)</span></label>
                <input type="url" th:field="*{evidenceUrl}" class="form-control" maxlength="255"
                       placeholder="https://docs.google.com/document/d/... or https://example.com/report.pdf"
                       th:classappend="${evidenceError != null} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${evidenceError != null}" th:text="${evidenceError}"></div>
                <div class="form-text"><i class="bi bi-file-earmark-text me-1"></i>Accepted: a <strong>Google Document</strong> link, a <strong>Google Drive</strong> file link, or a <strong>PDF</strong> link.</div>
            </div>
            <button type="submit" class="btn btn-navy" th:if="${nomination.id == null}"><i class="bi bi-send me-1"></i>Submit Nomination</button>
            <button type="submit" class="btn btn-navy" th:if="${nomination.id != null}"><i class="bi bi-check2 me-1"></i>Save Changes</button>
            <a th:href="${nomination.id == null} ? @{/nominations} : @{'/nominations/' + ${nomination.id}}" class="btn btn-outline-secondary"><i class="bi bi-x-lg me-1"></i>Cancel</a>
        </form>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
