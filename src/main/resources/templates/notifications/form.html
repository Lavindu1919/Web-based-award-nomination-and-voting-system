<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head th:replace="~{fragments/head :: head('Compose Notification')}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container py-5" style="max-width:640px;">
    <div class="page-eyebrow">Module 4 — Notification &amp; Feedback Management</div>
    <h2 class="mb-4"><i class="bi bi-send me-2"></i>Compose Notification</h2>

    <div class="av-card p-4">
        <form th:action="@{/notifications/create}" method="post">
            <div class="mb-3">
                <label class="form-label">Recipient</label>
                <select name="recipientId" class="form-select" required>
                    <option th:each="u : ${users}" th:value="${u.id}" th:text="${u.fullName} + ' (' + ${u.username} + ')'"></option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Message</label>
                <textarea name="message" class="form-control" rows="4" required></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Channel</label>
                <select name="type" class="form-select">
                    <option th:each="t : ${types}" th:value="${t}" th:text="${t}"></option>
                </select>
            </div>
            <div class="mb-4">
                <label class="form-label">Related To <span class="text-muted fw-normal">(optional label, e.g. "Nomination#12")</span></label>
                <input type="text" name="relatedEntity" class="form-control">
            </div>
            <button type="submit" class="btn btn-navy"><i class="bi bi-send me-1"></i>Send Notification</button>
            <a th:href="@{/notifications}" class="btn btn-outline-secondary"><i class="bi bi-x-lg me-1"></i>Cancel</a>
        </form>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
