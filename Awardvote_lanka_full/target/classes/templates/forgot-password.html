<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head th:replace="~{fragments/head :: head('Forgot Password')}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="auth-shell">
    <div class="auth-card">
        <div class="text-center mb-4">
            <div class="seal-badge mx-auto mb-3"><i class="bi bi-key"></i></div>
            <h3 class="mb-0">Forgot your password?</h3>
            <p class="text-muted small">Enter your username or email and we'll send a 6-digit reset code.</p>
        </div>

        <form th:action="@{/forgot-password}" method="post">
            <div class="mb-3">
                <label class="form-label">Username or Email</label>
                <div class="field-icon-group">
                    <i class="bi bi-person"></i>
                    <input type="text" name="identifier" class="form-control" required autofocus placeholder="e.g. voter or voter@awardvotelanka.lk">
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label d-block mb-2">Send the code via</label>
                <div class="row g-2">
                    <div class="col-6">
                        <input type="radio" class="btn-check" name="channel" id="channelEmail" value="EMAIL" checked>
                        <label class="av-card w-100 p-2 text-center small mb-0" for="channelEmail" style="cursor:pointer;">
                            <i class="bi bi-envelope d-block fs-5 mb-1"></i>Email
                        </label>
                    </div>
                    <div class="col-6">
                        <input type="radio" class="btn-check" name="channel" id="channelSms" value="SMS">
                        <label class="av-card w-100 p-2 text-center small mb-0" for="channelSms" style="cursor:pointer;">
                            <i class="bi bi-phone d-block fs-5 mb-1"></i>SMS
                        </label>
                    </div>
                </div>
                <div class="form-text">If SMS is chosen but no phone number is on file, we'll send the code by email instead.</div>
            </div>

            <button type="submit" class="btn btn-navy w-100"><i class="bi bi-send me-1"></i>Send Reset Code</button>
        </form>

        <p class="text-center text-muted small mt-3 mb-0">
            <a th:href="@{/login}"><i class="bi bi-arrow-left me-1"></i>Back to log in</a>
        </p>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
