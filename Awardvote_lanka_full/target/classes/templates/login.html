<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head th:replace="~{fragments/head :: head('Log in')}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="auth-shell">
    <div class="auth-card">
        <div class="text-center mb-4">
            <div class="seal-badge mx-auto mb-3">AVL</div>
            <h3 class="mb-0">Welcome back</h3>
            <p class="text-muted small">Log in to Award Vote Lanka</p>
        </div>

        <div class="alert alert-success py-2" th:if="${param.registered != null}"><i class="bi bi-check-circle me-1"></i>Account created — please log in.</div>
        <div class="alert alert-success py-2" th:if="${param.resetSuccess != null}"><i class="bi bi-check-circle me-1"></i>Password reset — please log in with your new password.</div>
        <div class="alert alert-success py-2" th:if="${accountDeleted}"><i class="bi bi-check-circle me-1"></i>Your account has been removed. We're sorry to see you go.</div>
        <div class="alert alert-danger py-2" th:if="${error}"><i class="bi bi-exclamation-triangle me-1"></i><span th:text="${error}"></span></div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <div class="field-icon-group">
                    <i class="bi bi-person"></i>
                    <input type="text" name="username" class="form-control" required autofocus>
                </div>
            </div>
            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center">
                    <label class="form-label mb-0">Password</label>
                    <a th:href="@{/forgot-password}" class="small">Forgot password?</a>
                </div>
                <div class="field-icon-group">
                    <i class="bi bi-lock"></i>
                    <input type="password" name="password" class="form-control" required>
                </div>
            </div>
            <button type="submit" class="btn btn-navy w-100"><i class="bi bi-box-arrow-in-right me-1"></i>Log in</button>
        </form>
        <p class="text-center text-muted small mt-3 mb-0">
            New here? <a th:href="@{/register}">Create an account</a>
        </p>
        <hr>

    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
