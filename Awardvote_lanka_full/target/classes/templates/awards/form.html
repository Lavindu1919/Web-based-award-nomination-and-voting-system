<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head th:replace="~{fragments/head :: head('Programme Form')}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container py-5" style="max-width:640px;">
    <h2 class="mb-4" th:text="${programme.id} != null ? 'Edit Award Programme' : 'New Award Programme'">Form</h2>
    <div class="av-card p-4">
        <form th:action="@{/awards/save}" th:object="${programme}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" th:field="*{name}" class="form-control" maxlength="255" required
                       th:classappend="${nameError != null} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${nameError != null}" th:text="${nameError}"></div>
            </div>
            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Year</label>
                <input type="number" th:field="*{year}" class="form-control" min="2026" step="1" required
                       th:classappend="${yearError != null} ? 'is-invalid'">
                <div class="invalid-feedback" th:if="${yearError != null}" th:text="${yearError}"></div>
                <div class="form-text">2026 or later.</div>
            </div>
            <div class="mb-3">
                <label class="form-label">Status</label>
                <select th:field="*{status}" class="form-select">
                    <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
                </select>
            </div>
            <button type="submit" class="btn btn-navy"><i class="bi bi-check-lg me-1"></i>Save</button>
            <a th:href="@{/awards}" class="btn btn-outline-secondary"><i class="bi bi-x-lg me-1"></i>Cancel</a>
        </form>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
