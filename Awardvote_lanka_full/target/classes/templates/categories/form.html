<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head th:replace="~{fragments/head :: head('Category Form')}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container py-5" style="max-width:640px;">
    <h2 class="mb-4" th:text="${category.id} != null ? 'Edit Category' : 'New Category'">Form</h2>
    <div class="av-card p-4">
        <form th:action="@{/categories/save}" th:object="${category}" method="post">
            <input type="hidden" th:field="*{id}">
            <input type="hidden" name="programmeId" th:value="${category.awardProgramme.id}">
            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" th:field="*{name}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea th:field="*{description}" class="form-control" rows="2"></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Eligibility Criteria</label>
                <textarea th:field="*{eligibilityCriteria}" class="form-control" rows="2"></textarea>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Voting Start</label>
                    <input type="datetime-local" th:field="*{votingStart}" class="form-control">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Voting End</label>
                    <input type="datetime-local" th:field="*{votingEnd}" class="form-control">
                </div>
            </div>
            <div class="form-check mb-3">
                <input type="checkbox" th:field="*{judgingEnabled}" class="form-check-input">
                <label class="form-check-label">Judging Enabled</label>
            </div>
            <button type="submit" class="btn btn-navy"><i class="bi bi-check-lg me-1"></i>Save</button>
            <a th:href="@{'/awards/' + ${category.awardProgramme.id}}" class="btn btn-outline-secondary"><i class="bi bi-x-lg me-1"></i>Cancel</a>
        </form>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
