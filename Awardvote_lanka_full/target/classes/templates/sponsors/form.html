<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head th:replace="~{fragments/head :: head('Sponsor Form')}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container py-5" style="max-width:640px;">
    <h2 class="mb-4" th:text="${sponsor.id} != null ? 'Edit Sponsor' : 'New Sponsor'">Form</h2>
    <div class="av-card p-4">
        <form th:action="@{/sponsors/save}" th:object="${sponsor}" method="post">
            <input type="hidden" th:field="*{id}">
            <div class="mb-3">
                <label class="form-label">Sponsor / Partner Name</label>
                <input type="text" th:field="*{name}" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Contact Person</label>
                <input type="text" th:field="*{contactPerson}" class="form-control">
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" th:field="*{email}" class="form-control">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Phone</label>
                    <input type="text" th:field="*{phone}" class="form-control">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Logo URL</label>
                <input type="text" th:field="*{logoUrl}" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">Tier</label>
                <select th:field="*{tier}" class="form-select">
                    <option th:each="t : ${tiers}" th:value="${t}" th:text="${t}"></option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
            </div>
            <button type="submit" class="btn btn-navy"><i class="bi bi-check-lg me-1"></i>Save</button>
            <a th:href="@{/sponsors}" class="btn btn-outline-secondary"><i class="bi bi-x-lg me-1"></i>Cancel</a>
        </form>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
