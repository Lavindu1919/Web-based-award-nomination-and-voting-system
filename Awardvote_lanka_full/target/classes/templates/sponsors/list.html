<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head th:replace="~{fragments/head :: head('Sponsors & Partners')}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div><div class="page-eyebrow">Module 5 — Sponsor &amp; Partner Management</div><h2 class="mb-0"><i class="bi bi-briefcase me-2"></i>Sponsors &amp; Partners</h2></div>
        <a th:href="@{/sponsors/new}" class="btn btn-gold"
           th:if="${session.loggedInUser != null and session.loggedInUser.hasPermission(T(com.sliit.awardvote.user.model.Permission).MANAGE_SPONSORS)}">
            <i class="bi bi-plus-circle me-1"></i>New Sponsor
        </a>
    </div>

    <div class="alert alert-danger py-2" th:if="${error}"><i class="bi bi-exclamation-triangle me-1"></i><span th:text="${error}"></span></div>
    <div class="row g-4 reveal-grid">
        <div class="col-md-6 col-lg-4" th:each="s : ${sponsors}">
            <div class="av-card p-3 h-100">
                <div class="d-flex justify-content-between align-items-start">
                    <h5 th:text="${s.sponsor.name}">Sponsor</h5>
                    <span class="badge-status badge-open" th:text="${s.sponsor.tier}">TIER</span>
                </div>
                <p class="text-muted small mb-1" th:text="${s.sponsor.contactPerson}">Contact</p>
                <p class="small" th:text="${s.sponsor.description}">Description</p>
                <p class="small text-muted mb-1"><i class="bi bi-star me-1"></i><span th:text="${s.benefits}">Benefits</span></p>
                <div class="d-flex gap-2 mt-2"
                     th:if="${session.loggedInUser != null and session.loggedInUser.hasPermission(T(com.sliit.awardvote.user.model.Permission).MANAGE_SPONSORS)}">
                    <a th:href="@{'/sponsors/' + ${s.sponsor.id} + '/edit'}" class="btn btn-outline-navy btn-sm"><i class="bi bi-pencil me-1"></i>Edit</a>
                    <a th:href="@{'/sponsors/' + ${s.sponsor.id} + '/delete'}" class="btn btn-outline-danger btn-sm"
                       onclick="return confirm('Delete this sponsor?')"><i class="bi bi-trash me-1"></i>Delete</a>
                </div>
            </div>
        </div>
        <div class="col-12" th:if="${#lists.isEmpty(sponsors)}">
            <div class="empty-state"><i class="bi bi-briefcase"></i><p>No sponsors yet.</p></div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
