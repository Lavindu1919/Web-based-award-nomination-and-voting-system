<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head th:replace="~{fragments/head :: head('Website Content')}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container py-5">
    <div class="page-eyebrow">Module 6 — Website Content Management</div><h2 class="mb-4"><i class="bi bi-newspaper me-2"></i>Website Content Management</h2>

    <ul class="nav nav-tabs" id="contentTabs" role="tablist">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-announce" type="button"><i class="bi bi-megaphone me-1"></i>Announcements</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-banner" type="button"><i class="bi bi-image me-1"></i>Banners</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-faq" type="button"><i class="bi bi-question-circle me-1"></i>FAQs</button></li>
    </ul>

    <div class="tab-content av-card p-4">

        <!-- Announcements -->
        <div class="tab-pane fade show active" id="tab-announce">
            <form th:action="@{/content/announcements/save}" th:object="${newAnnouncement}" method="post" class="row g-2 mb-4">
                <div class="col-md-4"><input type="text" th:field="*{title}" class="form-control" placeholder="Title" required></div>
                <div class="col-md-6"><input type="text" th:field="*{content}" class="form-control" placeholder="Content" required></div>
                <div class="col-md-2"><button type="submit" class="btn btn-navy w-100"><i class="bi bi-plus-lg"></i></button></div>
            </form>
            <div class="d-none d-md-flex fw-bold text-muted small px-2 pb-1">
                <div style="flex:0 0 25%">Title</div><div style="flex:0 0 45%">Content</div><div style="flex:0 0 10%">Active</div><div style="flex:1">Actions</div>
            </div>
            <form th:each="a : ${announcements}" th:action="@{/content/announcements/save}" method="post"
                  class="d-flex flex-wrap align-items-center gap-2 border-bottom border-secondary-subtle py-2 px-2">
                <input type="hidden" name="id" th:value="${a.id}">
                <input type="text" name="title" th:value="${a.title}" class="form-control form-control-sm" style="flex:0 0 25%" required>
                <input type="text" name="content" th:value="${a.content}" class="form-control form-control-sm" style="flex:0 0 45%" required>
                <span style="flex:0 0 10%" class="text-center">
                    <input type="checkbox" name="active" value="true" th:checked="${a.active}" class="form-check-input">
                    <input type="hidden" name="_active" value="on">
                </span>
                <span class="d-flex gap-1">
                    <button type="submit" class="btn btn-sm btn-outline-navy"><i class="bi bi-check-lg"></i></button>
                    <a th:href="@{'/content/announcements/' + ${a.id} + '/delete'}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this announcement?')"><i class="bi bi-trash"></i></a>
                </span>
            </form>
        </div>

        <!-- Banners -->
        <div class="tab-pane fade" id="tab-banner">
            <form th:action="@{/content/banners/save}" th:object="${newBanner}" method="post" class="row g-2 mb-4 align-items-center">
                <div class="col-md-3"><input type="text" th:field="*{title}" class="form-control" placeholder="Title" required></div>
                <div class="col-md-3">
                    <input type="text" th:field="*{imageUrl}" class="form-control" placeholder="Image URL"
                           oninput="document.getElementById('newBannerPreview').src=this.value">
                </div>
                <div class="col-md-2"><input type="text" th:field="*{linkUrl}" class="form-control" placeholder="Link URL"></div>
                <div class="col-md-1"><input type="number" th:field="*{displayOrder}" class="form-control" placeholder="Order"></div>
                <div class="col-md-1"><button type="submit" class="btn btn-navy w-100"><i class="bi bi-plus-lg"></i></button></div>
                <div class="col-md-2">
                    <img id="newBannerPreview" src="" alt="" style="max-width:100%;max-height:40px;object-fit:cover;border-radius:4px"
                         onerror="this.style.visibility='hidden'" onload="this.style.visibility='visible'">
                </div>
            </form>
            <div class="d-none d-md-flex fw-bold text-muted small px-2 pb-1">
                <div style="flex:0 0 10%">Preview</div><div style="flex:0 0 15%">Title</div><div style="flex:0 0 20%">Image URL</div><div style="flex:0 0 20%">Link URL</div><div style="flex:0 0 8%">Order</div><div style="flex:0 0 8%">Active</div><div style="flex:1">Actions</div>
            </div>
            <form th:each="b : ${banners}" th:action="@{/content/banners/save}" method="post"
                  class="d-flex flex-wrap align-items-center gap-2 border-bottom border-secondary-subtle py-2 px-2">
                <input type="hidden" name="id" th:value="${b.id}">
                <span style="flex:0 0 10%">
                    <img th:if="${b.imageUrl}" th:src="${b.imageUrl}" alt="Preview"
                         style="width:64px;height:40px;object-fit:cover;border-radius:4px"
                         onerror="this.style.display='none';this.nextElementSibling.style.display='inline-flex'">
                    <span class="d-inline-flex align-items-center justify-content-center text-muted small"
                          th:style="${b.imageUrl} ? 'display:none' : ''" style="width:64px;height:40px;border:1px dashed var(--bs-border-color);border-radius:4px">
                        <i class="bi bi-image"></i>
                    </span>
                </span>
                <input type="text" name="title" th:value="${b.title}" class="form-control form-control-sm" style="flex:0 0 15%" required>
                <input type="text" name="imageUrl" th:value="${b.imageUrl}" class="form-control form-control-sm" style="flex:0 0 20%">
                <input type="text" name="linkUrl" th:value="${b.linkUrl}" class="form-control form-control-sm" style="flex:0 0 20%">
                <input type="number" name="displayOrder" th:value="${b.displayOrder}" class="form-control form-control-sm" style="flex:0 0 8%">
                <span style="flex:0 0 8%" class="text-center">
                    <input type="checkbox" name="active" value="true" th:checked="${b.active}" class="form-check-input">
                    <input type="hidden" name="_active" value="on">
                </span>
                <span class="d-flex gap-1">
                    <button type="submit" class="btn btn-sm btn-outline-navy"><i class="bi bi-check-lg"></i></button>
                    <a th:href="@{'/content/banners/' + ${b.id} + '/delete'}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this banner?')"><i class="bi bi-trash"></i></a>
                </span>
            </form>
        </div>

        <!-- FAQs -->
        <div class="tab-pane fade" id="tab-faq">
            <form th:action="@{/content/faqs/save}" th:object="${newFaq}" method="post" class="row g-2 mb-4">
                <div class="col-md-4"><input type="text" th:field="*{question}" class="form-control" placeholder="Question" required></div>
                <div class="col-md-5"><input type="text" th:field="*{answer}" class="form-control" placeholder="Answer" required></div>
                <div class="col-md-2"><input type="text" th:field="*{category}" class="form-control" placeholder="Category"></div>
                <div class="col-md-1"><button type="submit" class="btn btn-navy w-100"><i class="bi bi-plus-lg"></i></button></div>
            </form>
            <div class="d-none d-md-flex fw-bold text-muted small px-2 pb-1">
                <div style="flex:0 0 25%">Question</div><div style="flex:0 0 35%">Answer</div><div style="flex:0 0 15%">Category</div><div style="flex:0 0 10%">Order</div><div style="flex:1">Actions</div>
            </div>
            <form th:each="f : ${faqs}" th:action="@{/content/faqs/save}" method="post"
                  class="d-flex flex-wrap align-items-center gap-2 border-bottom border-secondary-subtle py-2 px-2">
                <input type="hidden" name="id" th:value="${f.id}">
                <input type="text" name="question" th:value="${f.question}" class="form-control form-control-sm" style="flex:0 0 25%" required>
                <input type="text" name="answer" th:value="${f.answer}" class="form-control form-control-sm" style="flex:0 0 35%" required>
                <input type="text" name="category" th:value="${f.category}" class="form-control form-control-sm" style="flex:0 0 15%">
                <input type="number" name="displayOrder" th:value="${f.displayOrder}" class="form-control form-control-sm" style="flex:0 0 10%">
                <span class="d-flex gap-1">
                    <button type="submit" class="btn btn-sm btn-outline-navy"><i class="bi bi-check-lg"></i></button>
                    <a th:href="@{'/content/faqs/' + ${f.id} + '/delete'}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Delete this FAQ?')"><i class="bi bi-trash"></i></a>
                </span>
            </form>
        </div>

    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
