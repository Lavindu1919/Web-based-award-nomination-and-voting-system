<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head th:replace="~{fragments/head :: head('Verify Account')}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="auth-shell">
    <div class="auth-card">
        <div class="text-center mb-4">
            <div class="seal-badge mx-auto mb-3"><i class="bi bi-patch-check"></i></div>
            <h3 class="mb-0">Verify your account</h3>
        </div>

        <div class="alert alert-success py-2" th:if="${resent}"><i class="bi bi-check-circle me-1"></i>A new code has been sent.</div>
        <div class="alert alert-info py-2" th:if="${channel != null and resent == null}">
            <i class="bi bi-info-circle me-1"></i>
            We've sent a 6-digit verification code via <strong th:text="${channel}">EMAIL</strong> for
            <strong th:text="${identifier}">username</strong>. It expires in 10 minutes.
        </div>
        <div class="alert alert-danger py-2" th:if="${error}"><i class="bi bi-exclamation-triangle me-1"></i><span th:text="${error}"></span></div>

        <form th:action="@{/verify-account}" method="post">
            <input type="hidden" name="identifier" th:value="${identifier}">
            <div class="mb-4">
                <label class="form-label">6-Digit Code</label>
                <div class="field-icon-group">
                    <i class="bi bi-hash"></i>
                    <input type="text" name="code" class="form-control" required autofocus maxlength="6"
                           pattern="[0-9]{6}" placeholder="123456" inputmode="numeric">
                </div>
            </div>
            <button type="submit" class="btn btn-navy w-100"><i class="bi bi-patch-check-fill me-1"></i>Verify &amp; Activate Account</button>
        </form>

        <form th:action="@{/verify-account/resend}" method="post" class="mt-3">
            <input type="hidden" name="identifier" th:value="${identifier}">
            <input type="hidden" name="channel" th:value="${channel != null ? channel : 'EMAIL'}">
            <button type="submit" class="btn btn-outline-secondary w-100 btn-sm"><i class="bi bi-arrow-repeat me-1"></i>Resend Code</button>
        </form>

        <p class="text-center text-muted small mt-3 mb-0">
            <a th:href="@{/login}"><i class="bi bi-arrow-left me-1"></i>Back to log in</a>
        </p>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
