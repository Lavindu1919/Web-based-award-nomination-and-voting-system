<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head th:replace="~{fragments/head :: head('Something went wrong')}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="auth-shell">
    <div class="auth-card text-center" style="max-width:500px;">
        <div class="seal-badge mx-auto mb-3"><i class="bi bi-exclamation-triangle"></i></div>
        <h3 class="mb-2" th:text="${errorTitle} ?: 'Something went wrong'"></h3>
        <p class="text-muted" th:text="${error} ?: 'An unexpected error occurred. Please try again.'"></p>
        <a href="/" class="btn btn-primary mt-2">Back to Home</a>
    </div>
</div>

</body>
</html>
