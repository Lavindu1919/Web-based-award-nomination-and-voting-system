<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head th:replace="~{fragments/head :: head('Reset Password')}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="auth-shell">
    <div class="auth-card">
        <div class="text-center mb-4">
            <div class="seal-badge mx-auto mb-3"><i class="bi bi-shield-check"></i></div>
            <h3 class="mb-0">Enter your reset code</h3>
        </div>

        <div class="alert alert-info py-2" th:if="${channel != null}">
            <i class="bi bi-info-circle me-1"></i>
            If an account matches <strong th:text="${identifier}">identifier</strong>, we've sent a 6-digit code via
            <strong th:text="${channel}">EMAIL</strong>. It expires in 10 minutes.
        </div>
        <div class="alert alert-danger py-2" th:if="${error}"><i class="bi bi-exclamation-triangle me-1"></i><span th:text="${error}"></span></div>

        <form th:action="@{/reset-password}" method="post">
            <input type="hidden" name="identifier" th:value="${identifier}">
            <div class="mb-3">
                <label class="form-label">6-Digit Code</label>
                <div class="field-icon-group">
                    <i class="bi bi-hash"></i>
                    <input type="text" name="code" class="form-control" required autofocus maxlength="6"
                           pattern="[0-9]{6}" placeholder="123456" inputmode="numeric">
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label">New Password</label>
                <div class="field-icon-group">
                    <i class="bi bi-lock"></i>
                    <input type="password" name="newPassword" class="form-control" required minlength="4">
                </div>
            </div>
            <button type="submit" class="btn btn-navy w-100"><i class="bi bi-check-lg me-1"></i>Reset Password</button>
        </form>

        <p class="text-center text-muted small mt-3 mb-0">
            Didn't get a code? <a th:href="@{/forgot-password}">Request a new one</a>
        </p>
        <p class="text-center text-muted small mb-0">
            <a th:href="@{/login}"><i class="bi bi-arrow-left me-1"></i>Back to log in</a>
        </p>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
