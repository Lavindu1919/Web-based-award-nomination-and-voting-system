<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head th:replace="~{fragments/head :: head('Manage Users')}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div><div class="page-eyebrow">Module 1 — User Management</div><h2 class="mb-0"><i class="bi bi-people me-2"></i>User Management</h2></div>
        <a th:href="@{/users/new}" class="btn btn-gold"><i class="bi bi-plus-circle me-1"></i>New User</a>
    </div>
    <p class="text-muted">Manage accounts, roles and access permissions for everyone interacting with the system.</p>

    <div class="alert alert-success py-2" th:if="${success}"><i class="bi bi-check-circle me-1"></i><span th:text="${success}"></span></div>
    <div class="alert alert-danger py-2" th:if="${error}"><i class="bi bi-exclamation-triangle me-1"></i><span th:text="${error}"></span></div>

    <div class="table-responsive av-card">
        <table class="table table-ledger mb-0 align-middle">
            <thead>
            <tr><th>Name</th><th>Username</th><th>Email</th><th>Role</th><th>Custom Role</th><th>Status</th><th></th></tr>
            </thead>
            <tbody>
            <tr th:each="u : ${users}">
                <td th:text="${u.fullName}">Name</td>
                <td th:text="${u.username}">username</td>
                <td th:text="${u.email}">email</td>
                <td th:text="${u.role}">ROLE</td>
                <td>
                    <span class="badge-status badge-submitted" th:if="${u.customRole != null}" th:text="${u.customRole.name}">Custom Role</span>
                    <span class="text-muted small" th:if="${u.customRole == null}">—</span>
                </td>
                <td>
                    <span class="badge-status" th:classappend="${u.active} ? 'badge-approved' : 'badge-rejected'"
                          th:text="${u.active} ? 'Active' : 'Disabled'">Active</span>
                </td>
                <td class="text-end">
                    <a th:href="@{'/users/' + ${u.id} + '/edit'}" class="btn btn-sm btn-outline-navy"><i class="bi bi-pencil me-1"></i>Edit</a>
                    <a th:href="@{'/users/' + ${u.id} + '/toggle'}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-toggle2-on me-1"></i>Toggle</a>
                    <form th:if="${session.loggedInUser.id != u.id and (session.loggedInUser.role.name() == 'SYSTEM_ADMIN' or u.role.name() != 'SYSTEM_ADMIN')}"
                          th:action="@{'/users/' + ${u.id} + '/delete'}" method="post" class="d-inline"
                          onsubmit="return confirm('Permanently delete this account? It will be removed from the database together with its votes, scores and notifications. This cannot be undone.');">
                        <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash me-1"></i>Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
