<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head th:replace="~{fragments/head :: head('Register')}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="auth-shell">
    <div class="auth-card" style="max-width:500px;">
        <div class="text-center mb-4">
            <div class="seal-badge mx-auto mb-3">AVL</div>
            <h3 class="mb-0">Create your account</h3>
            <p class="text-muted small">Register as a Public User to submit nominations and vote</p>
        </div>

        <div class="alert alert-danger py-2" th:if="${error}"><i class="bi bi-exclamation-triangle me-1"></i><span th:text="${error}"></span></div>

        <form th:action="@{/register}" th:object="${user}" method="post">
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <div class="field-icon-group"><i class="bi bi-person"></i><input type="text" th:field="*{fullName}" class="form-control" required></div>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <div class="field-icon-group"><i class="bi bi-envelope"></i><input type="email" th:field="*{email}" class="form-control" maxlength="254" placeholder="name@example.com" required></div>
            </div>
            <div class="mb-3">
                <label class="form-label">Phone</label>
                <div class="field-icon-group"><i class="bi bi-telephone"></i><input type="text" th:field="*{phone}" class="form-control"></div>
            </div>
            <div class="mb-3">
                <label class="form-label">Username</label>
                <div class="field-icon-group"><i class="bi bi-at"></i><input type="text" th:field="*{username}" class="form-control" required></div>
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <div class="field-icon-group"><i class="bi bi-lock"></i><input type="password" th:field="*{password}" class="form-control" minlength="5" required></div>
                <div class="form-text">At least 5 characters.</div>
            </div>
            <div class="mb-4">
                <label class="form-label d-block mb-2">Verify my account via</label>
                <div class="row g-2">
                    <div class="col-6">
                        <input type="radio" class="btn-check" name="channel" id="regChannelEmail" value="EMAIL" checked>
                        <label class="av-card w-100 p-2 text-center small mb-0" for="regChannelEmail" style="cursor:pointer;">
                            <i class="bi bi-envelope d-block fs-5 mb-1"></i>Email
                        </label>
                    </div>
                    <div class="col-6">
                        <input type="radio" class="btn-check" name="channel" id="regChannelSms" value="SMS">
                        <label class="av-card w-100 p-2 text-center small mb-0" for="regChannelSms" style="cursor:pointer;">
                            <i class="bi bi-phone d-block fs-5 mb-1"></i>SMS
                        </label>
                    </div>
                </div>
                <div class="form-text">We'll send a 6-digit code to confirm it's really you before your account is enabled.</div>
            </div>
            <button type="submit" class="btn btn-navy w-100"><i class="bi bi-person-check me-1"></i>Create account</button>
        </form>
        <p class="text-center text-muted small mt-3 mb-0">
            Already registered? <a th:href="@{/login}">Log in</a>
        </p>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
