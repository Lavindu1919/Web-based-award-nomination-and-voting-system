<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-bs-theme="dark">
<head th:replace="~{fragments/head :: head(${feedback.id} != null ? 'Edit Feedback' : 'Log Feedback')}"></head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container py-5" style="max-width:640px;">
    <div class="page-eyebrow">Module 4 — Notification &amp; Feedback Management</div>
    <h2 class="mb-4">
        <i class="bi bi-chat-dots me-2"></i>
        <span th:text="${feedback.id} != null ? 'Edit Feedback' : 'Log Feedback'">Feedback Form</span>
    </h2>

    <div class="alert alert-info py-2" th:if="${feedback.id} == null">
        <i class="bi bi-info-circle me-1"></i>Use this to record an inquiry or complaint received by phone, in person, or any channel outside the public form.
    </div>

    <div class="av-card p-4">
        <form th:action="${feedback.id} != null ? @{'/feedback/' + ${feedback.id} + '/update'} : @{/feedback/create}"
              th:object="${feedback}" method="post">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Name</label>
                    <input type="text" th:field="*{name}" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" th:field="*{email}" class="form-control" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Subject</label>
                <input type="text" th:field="*{subject}" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">Message</label>
                <textarea th:field="*{message}" class="form-control" rows="4" required></textarea>
            </div>
            <div class="mb-4" th:if="${canManageStatus}">
                <label class="form-label">Status</label>
                <select name="status" class="form-select">
                    <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"
                            th:selected="${feedback.status == s or (feedback.status == null and s.name() == 'OPEN')}"></option>
                </select>
            </div>
            <button type="submit" class="btn btn-navy"><i class="bi bi-check-lg me-1"></i>Save</button>
            <a th:href="@{/feedback}" class="btn btn-outline-secondary"><i class="bi bi-x-lg me-1"></i>Cancel</a>
        </form>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
